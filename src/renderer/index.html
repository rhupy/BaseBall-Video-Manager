<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Video Manager</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- 헤더 -->
      <header class="header">
        <div class="header-left">
          <div class="language-toggle">
            <label class="language-switch" title="언어 변경 / Language Toggle">
              <input type="checkbox" id="language-toggle">
              <span class="language-slider">
                <span class="language-label ko">한</span>
                <span class="language-label en">EN</span>
              </span>
            </label>
          </div>
          <h1 data-i18n="appTitle">Baseball Video Manager</h1>
        </div>
        <div class="header-controls">
          <button id="backup-btn" class="btn btn-info" data-i18n="dataBackup">데이터 백업</button>
          <button id="extensions-btn" class="btn btn-success" data-i18n="extensionManagement">확장자 관리</button>
          <button id="refresh-btn" class="btn btn-primary" data-i18n="refresh">새로고침</button>
          <button id="library-btn" class="btn btn-secondary" data-i18n="libraryManagement">
            라이브러리 관리
          </button>
          <button id="sync-settings-btn" class="btn btn-sync" data-i18n="syncSettings">동기화</button>
          <button id="cleanup-btn" class="btn btn-warning" data-i18n="cleanup">정리</button>
        </div>
      </header>

      <!-- 검색 바 -->
      <div class="search-container">
        <div class="sort-controls">
          <div class="sort-direction-toggle">
            <label class="toggle-switch" title="정렬 방향 변경">
              <input type="checkbox" id="sort-direction-toggle" checked>
              <span class="toggle-slider">
                <span class="toggle-label desc">↓</span>
                <span class="toggle-label asc">↑</span>
              </span>
            </label>
            <span class="sort-direction-label" data-i18n="descending">내림차순</span>
          </div>
          <div class="sort-buttons">
            <button class="sort-btn active" data-sort="addtime" data-i18n="sortAddTime">추가시간순</button>
            <button class="sort-btn" data-sort="lasttime" data-i18n="sortLastTime">실행시간순</button>
            <button class="sort-btn" data-sort="rating" data-i18n="sortRating">평점순</button>
            <button class="sort-btn" data-sort="name" data-i18n="sortName">이름순</button>
          </div>
        </div>
        <input
          type="text"
          id="search-input"
          placeholder="파일명으로 검색..."
          data-i18n="searchPlaceholder"
          class="search-input"
        />
        <div class="file-stats"><span id="file-count">0</span> <span data-i18n="filesCount">개 파일</span></div>
      </div>

      <!-- 탭 메뉴 -->
      <div class="tab-container">
        <button class="tab-btn active" data-tab="video" data-i18n="videoFiles">비디오 파일</button>
        <button class="tab-btn" data-tab="file" data-i18n="otherFiles">기타 파일</button>
      </div>

      <!-- 진행률 표시 -->
      <div id="progress-container" class="progress-container hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text" data-i18n="processing">처리 중...</span>
      </div>

      <!-- 파일 리스트 -->
      <div class="content">
        <div class="virtual-scroll-container">
          <div id="file-list" class="file-list">
            <div id="virtual-scroller" class="virtual-scroller">
              <!-- 가상 스크롤링으로 동적 생성 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 상태 바 -->
      <footer class="status-bar">
        <span id="status-text" data-i18n="ready">준비됨</span>
        <span id="extension-list" data-i18n="extensions"
          >확장자: .avi, .mp4, .mov, .wmv, .mkv, .flv, .ts</span
        >
      </footer>
    </div>

    <!-- 확장자 관리 모달 -->
    <div id="extensions-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-i18n="extensionManagementTitle">확장자 관리</h2>
          <button id="close-extensions-modal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="extensions-section">
            <h3 data-i18n="videoExtensions">비디오 파일 확장자</h3>
            <div class="extensions-controls">
              <input type="text" id="video-extension-input" placeholder=".mp4" maxlength="10">
              <button id="add-video-extension" class="btn btn-sm btn-primary" data-i18n="add">추가</button>
            </div>
            <div id="video-extensions-list" class="extensions-list">
              <!-- 동적 생성 -->
            </div>
          </div>
          
          <div class="extensions-section">
            <h3 data-i18n="otherExtensions">기타 파일 확장자</h3>
            <div class="extensions-controls">
              <input type="text" id="other-extension-input" placeholder=".zip" maxlength="10">
              <button id="add-other-extension" class="btn btn-sm btn-primary" data-i18n="add">추가</button>
            </div>
            <div id="other-extensions-list" class="extensions-list">
              <!-- 동적 생성 -->
            </div>
          </div>
          
          <div class="extensions-actions">
            <button id="reset-extensions" class="btn btn-secondary" data-i18n="resetToDefault">기본값으로 초기화</button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-extensions" class="btn btn-primary" data-i18n="save">저장</button>
          <button id="cancel-extensions" class="btn btn-secondary" data-i18n="cancel">취소</button>
        </div>
      </div>
    </div>

    <!-- 라이브러리 관리 모달 -->
    <div id="library-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-i18n="libraryManagementTitle">라이브러리 관리</h2>
          <button id="close-modal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="library-controls">
            <button id="add-library" class="btn btn-primary" data-i18n="addFolder">폴더 추가</button>
            <button id="remove-library" class="btn btn-danger" data-i18n="removeSelected">
              선택 삭제
            </button>
            <button
              id="open-data-folder"
              class="btn btn-secondary"
              data-i18n="openDataFolder"
              data-i18n-title="openDataFolderTooltip"
              title="데이터 폴더(/data)를 파일 탐색기에서 열기"
            >
              데이터 폴더 열기
            </button>
          </div>
          <div id="library-list" class="library-list">
            <!-- 동적 생성 -->
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-library" class="btn btn-primary" data-i18n="save">저장</button>
          <button id="cancel-library" class="btn btn-secondary" data-i18n="cancel">취소</button>
        </div>
      </div>
    </div>

    <!-- 동기화 설정 모달 -->
    <div id="sync-modal" class="modal hidden">
      <div class="modal-content" style="max-width: 480px;">
        <div class="modal-header">
          <h2 data-i18n="syncSettingsTitle">Git 동기화 설정</h2>
          <button id="close-sync-modal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="sync-status" id="sync-status"></div>
          <div class="sync-form">
            <label class="sync-label" data-i18n="syncRepo">저장소 URL</label>
            <input type="text" id="sync-repo-input" class="sync-input" placeholder="https://github.com/user/repo.git">
            <label class="sync-label" data-i18n="syncToken">Personal Access Token</label>
            <div class="sync-token-wrapper">
              <input type="password" id="sync-token-input" class="sync-input" placeholder="ghp_xxxxxxxxxxxx">
              <button id="sync-token-toggle" class="btn-token-toggle" title="토큰 보기/숨기기">👁</button>
            </div>
            <p class="sync-hint" data-i18n="syncHint">GitHub Settings > Developer settings > Personal access tokens에서 생성</p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="sync-test-btn" class="btn btn-info" data-i18n="syncTest">연결 테스트</button>
          <button id="sync-save-btn" class="btn btn-primary" data-i18n="save">저장</button>
          <button id="sync-disconnect-btn" class="btn btn-danger" data-i18n="syncDisconnect">연결 해제</button>
          <button id="sync-cancel-btn" class="btn btn-secondary" data-i18n="cancel">취소</button>
        </div>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/extension-manager.js"></script>
    <script src="js/file-manager.js"></script>
    <script src="js/virtual-scroll.js"></script>
    <script src="js/search-engine.js"></script>
    <script src="js/library-manager.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
